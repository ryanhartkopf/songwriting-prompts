services:
  app:
    build: .
    volumes:
      - ./db:/app/db:rw
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    develop:
      watch:
        - action: sync+restart
          path: src
          target: /app/src
        - action: rebuild
          path: requirements.txt
